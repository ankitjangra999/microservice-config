spring:
  application:
    name: Config-Default

  datasource:
    url: jdbc:mysql://localhost:3306/erp
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true         
    registry-with-eureka: true
    service-url:
      defaultZone: http://localhost:8443/eureka
